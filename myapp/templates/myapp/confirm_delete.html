{% extends 'base.html' %}

{% block body %}

<div class="container mt-5">

    <div class="card p-4 shadow text-center">

        <h3 class="mb-3 text-danger">
            Are you sure you want to delete?
        </h3>

        <h4 class="mb-4">
            {{ item.item_name }}
        </h4>

        <p>Once deleted, this item cannot be recovered.</p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger me-2">
                Yes, Delete
            </button>

            <a href="{% url 'myapp:detail' item.id %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>

</div>

{% endblock %}
