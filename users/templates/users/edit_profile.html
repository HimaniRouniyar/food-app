{% extends 'base.html' %}

{% block body %}

<div class="container">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">

        <h3 class="text-center mb-3">Edit Profile</h3>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary w-100">
                Save Changes
            </button>
        </form>

    </div>
</div>

{% endblock %}
